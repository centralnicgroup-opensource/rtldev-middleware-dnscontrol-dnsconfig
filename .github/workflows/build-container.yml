name: Build & Publish Docker Image

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build and Publish Docker image
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built through the devcontainer CLI rather than `docker build`, because
      # the image is only complete once the devcontainer features are applied:
      # Go, zsh, Node and the rest moved out of the Dockerfile and into the
      # feature list when this repository adopted the devbase Feature. A plain
      # `docker build` of .devcontainer/Dockerfile now produces a bare base image.
      - name: Build and push the devcontainer image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/rtldev_mid_dnscontrol
          imageTag: latest
          cacheFrom: ghcr.io/${{ github.repository }}/rtldev_mid_dnscontrol:latest
          push: always
