name: Dependabot auto-merge
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # The shared workflow, not a copy of it: it checks RTLDEV_MW_CI_TOKEN before merging and
  # reports a failure on the PR, which an inline merge step would not. (RSRMID-3099)
  dependabot:
    needs: tests
    uses: centralnicgroup-opensource/rtldev-middleware-shareable-workflows/.github/workflows/auto-merge-dependabot-pr.yml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
