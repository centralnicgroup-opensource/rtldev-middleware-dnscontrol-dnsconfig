name: Linting & Execute Integration Test in the Container

on:
  workflow_call:

jobs:
  build-docker-image:
    name: Step 1 - Workflow Call
    secrets: inherit
    uses: ./.github/workflows/build-container.yml
    permissions:
      contents: read
      packages: write

  test:
    name: Step 2 - Linting & Testing
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    needs: build-docker-image
    # Every run edits the same live OT&E zone (creds.json's domain), so two at once
    # corrupt each other's expected state -- "Expected 0 corrections on second run",
    # unexpected GENERATE_ZONE, deletes of records the other run already removed.
    # One group per repository serialises them. GitHub keeps only one pending job per
    # group and cancels an older pending one when a third arrives, so a burst of
    # Dependabot PRs leaves some checks cancelled: re-run those, never in parallel.
    # Never cancel-in-progress: a run cut off mid-test leaves the zone dirty. (RSRMID-3125)
    concurrency:
      group: ${{ github.repository }}-cnr-ote-zone
      cancel-in-progress: false
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tests run inside the devcontainer itself, built by the devcontainer
      # CLI so that the features are applied -- Go, zsh and Node live in the
      # feature list now, not in the Dockerfile, so `docker run` on a plain image
      # build would have none of them. The image published by step 1 is the build
      # cache, so this rebuild is a cache hit rather than a second full build.
      - name: Run integration tests in the devcontainer
        uses: devcontainers/ci@v0.3
        env:
          CNR_TEST_USER: ${{ secrets.RTLDEV_MW_CI_USER_CNR }}
          CNR_TEST_PASSWORD: ${{ secrets.RTLDEV_MW_CI_USERPASSWORD_CNR }}
        with:
          imageName: ghcr.io/${{ github.repository }}/rtldev_mid_dnscontrol
          imageTag: latest
          cacheFrom: ghcr.io/${{ github.repository }}/rtldev_mid_dnscontrol:latest
          push: never
          env: |
            CNR_TEST_USER
            CNR_TEST_PASSWORD
          runCmd: zsh ./tests/integration.sh
